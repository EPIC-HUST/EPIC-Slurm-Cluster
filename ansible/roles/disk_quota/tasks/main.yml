---
- name: Verify quota accounting is enabled for each managed filesystem
  ansible.builtin.command:
    argv:
      - quotaon
      - -p
      - "{{ item.filesystem }}"
  register: disk_quota_status
  check_mode: false
  environment:
    LC_ALL: C
  changed_when: false
  failed_when: >-
    disk_quota_status.stdout_lines
    | select('match', '^user quota on .* is on$')
    | list
    | length == 0
  loop: "{{ disk_quotas }}"
  loop_control:
    label: "{{ item.filesystem }}"

- name: Set quota grace periods
  ansible.builtin.command:
    argv:
      - setquota
      - -t
      - "{{ item.grace_period_seconds }}"
      - "{{ item.grace_period_seconds }}"
      - "{{ item.filesystem }}"
  loop: "{{ disk_quotas }}"
  loop_control:
    label: "{{ item.filesystem }}"
  changed_when: false

- name: Read existing user limits without changing quota records
  ansible.builtin.command:
    argv:
      - repquota
      - -u
      - -n
      - -p
      - -v
      - "{{ item.filesystem }}"
  environment:
    LC_ALL: C
  register: disk_quota_reports
  check_mode: false
  changed_when: false
  loop: "{{ disk_quotas }}"
  loop_control:
    label: "{{ item.filesystem }}"

- name: Apply only new or changed block and inode quotas
  ansible.builtin.command:
    argv:
      - setquota
      - -u
      - "{{ user.name }}"
      - "{{ (quota.soft_gib | int) * 1024 * 1024 }}"
      - "{{ (quota.hard_gib | int) * 1024 * 1024 }}"
      - 0
      - 0
      - "{{ quota.filesystem }}"
  loop: "{{ disk_quota_reports.results | product(cluster_users) | list }}"
  vars:
    quota: "{{ item.0.item }}"
    user: "{{ item.1 }}"
  loop_control:
    label: "{{ user.name }} on {{ quota.filesystem }}"
  # Rewriting an unchanged record can disturb an existing grace deadline.
  when: >-
    item.0.stdout | quota_limits_differ(
      user.uid, (quota.soft_gib | int) * 1024 * 1024,
      (quota.hard_gib | int) * 1024 * 1024)

- name: Install the OOD quota collector
  ansible.builtin.template:
    src: epic-disk-quota-collector.py.j2
    dest: /usr/local/sbin/epic-disk-quota-collector
    owner: root
    group: root
    mode: "0755"
  notify: Refresh disk quota collector

- name: Install the OOD quota collector service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - epic-disk-quota-collector.service
    - epic-disk-quota-collector.timer
  notify: Refresh disk quota collector

- name: Keep the OOD quota collector timer enabled
  ansible.builtin.systemd_service:
    name: epic-disk-quota-collector.timer
    enabled: true
    state: started
  when: not ansible_check_mode
